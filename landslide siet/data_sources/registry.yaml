    license: needs_review; check dataset-specific terms and attribution
    region_coverage: global, coverage and export method to verify
    fallback: synthetic inventory explicitly labeled only
    target_path: data_sources/raw/{region}/nasa_global_landslide_catalog.csv
    status: needs_review
