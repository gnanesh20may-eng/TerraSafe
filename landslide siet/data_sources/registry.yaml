sources:
  - id: open_meteo_nilgiris_history
    name: Open-Meteo Historical Weather (ERA5-Land reanalysis)
    category: meteorology
    url: https://archive-api.open-meteo.com/v1/archive
    access: open
    format: JSON
    update_frequency: daily with source-dependent reanalysis delay
    license: Free API terms state non-commercial use and attribution; review terms before redistribution
    region_coverage: global, point query
    fallback: SIMULATED fixture only; never label as observed weather
    target_path: data_sources/raw/{region}/open_meteo_history.json
    status: verified
    adapter: open_meteo_archive
  - id: usgs_earthquake_catalog
    name: USGS FDSN Earthquake Catalog
    category: sensor_context
    url: https://earthquake.usgs.gov/fdsnws/event/1/query
    access: open
    format: GeoJSON
    update_frequency: continuous catalog; query on demand
    license: U.S. government public data; cite USGS and check individual product terms
    region_coverage: global, bounded rectangle query
    fallback: empty result is valid; never synthesize events as real
    target_path: data_sources/raw/{region}/usgs_earthquakes.geojson
    status: verified
    adapter: usgs_fdsn
  - id: nasa_global_landslide_catalog
    name: NASA Global Landslide Catalog
